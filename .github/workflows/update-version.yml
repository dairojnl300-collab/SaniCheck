name: Auto-Update Version & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  update-version:
    name: Auto-Update Version & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
      
      - name: Update versionManager.js
        if: github.event_name == 'push'
        run: |
          sed -i "s/this.currentVersion = '[^']*'/this.currentVersion = '${{ steps.version.outputs.version }}'/" src/versionManager.js
          sed -i "s/this.commitHash = '[^']*'/this.commitHash = '${{ steps.version.outputs.commit }}'/" src/versionManager.js
      
      - name: Update Service Worker
        if: github.event_name == 'push'
        run: |
          sed -i "s/const CACHE_NAME = 'sanicheck-v[^']*'/const CACHE_NAME = 'sanicheck-v${{ steps.version.outputs.version }}'/" public/service-worker.js
          sed -i "s/const COMMIT_HASH = '[^']*'/const COMMIT_HASH = '${{ steps.version.outputs.commit }}'/" public/service-worker.js

      - name: Bump SW cache hash (sync-version.js)
        if: github.event_name == 'push'
        run: node scripts/sync-version.js

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/sw.js app/version.json; then
            echo "Sin cambios en sw.js/version.json — nada que commitear"
          else
            git add app/sw.js app/version.json
            git commit -m "chore: bump SW cache hash [skip ci]"
            git push
          fi

      - name: Generate portal-config.secrets.js
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            node scripts/generate-portal-config-secrets.js
          else
            echo "Skip: SUPABASE_ANON_KEY secret not configured"
          fi

      - name: PR validation
        if: github.event_name == 'pull_request'
        run: echo "Version check OK for PR"
